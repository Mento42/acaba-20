<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion - ACABA 2#0</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%2337003c'/%3E%3Ctext x='50' y='68' font-size='50' fill='%2300ff87' text-anchor='middle' font-family='Arial' font-weight='bold'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #37003c;
      --primary-dark: #2a002b;
      --gold: #00ff87;
      --gold-dark: #00cc6a;
      --bg-main: #f4f4f5;
      --text-main: #0f172a;
      --text-sec: #71717a;
      --border: #e4e4e7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      border-top: 6px solid var(--gold);
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo-box {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-weight: 900;
      font-size: 32px;
      margin: 0 auto 15px;
    }
    .logo h1 {
      color: var(--primary);
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .logo p {
      color: var(--gold-dark);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .logo .motto {
      font-style: italic;
      font-size: 11px;
      color: var(--text-sec);
      margin-top: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      color: var(--text-sec);
      letter-spacing: 0.5px;
    }
    .input-icon {
      position: relative;
    }
    .input-icon i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sec);
    }
    .form-control {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(0,255,135,0.2);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: var(--primary);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn:hover {
      background: var(--gold-dark);
      transform: translateY(-2px);
    }
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid #c33;
    }
    .error-message.show {
      display: block;
    }
    .success-message {
      background: #efe;
      color: #3c3;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid #3c3;
    }
    .success-message.show {
      display: block;
    }
    .footer {
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-sec);
    }
    .footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .security-notice {
      background: rgba(0,255,135,0.1);
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-sec);
      border-left: 4px solid var(--gold);
    }
    .security-notice i {
      color: var(--gold-dark);
      margin-right: 5px;
    }
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-box">AC</div>
      <h1>ACABA 2#0</h1>
      <p>Biyem-Assi</p>
      <p class="motto">Toujours unis !</p>
    </div>
    
    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email"><i class="fas fa-user"></i> Email ou Téléphone</label>
        <div class="input-icon">
          <i class="fas fa-envelope"></i>
          <input type="text" id="email" class="form-control" placeholder="votre@email.com ou 6XX XXX XXX" required>
        </div>
      </div>
      
      <div class="form-group">
        <label for="password"><i class="fas fa-lock"></i> Mot de passe</label>
        <div class="input-icon">
          <i class="fas fa-key"></i>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
      </div>
      
      <button type="submit" class="btn" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Se connecter
      </button>
    </form>
    
    <div class="security-notice">
      <i class="fas fa-shield-alt"></i>
      <strong>🔐 Accès sécurisé :</strong> Cette application est réservée aux membres autorisés de l'association ACABA 2#0.
    </div>
    
    <div class="footer">
      <p>© 2026 ACABA 2#0</p>
      <p>Association Club des Amis de Biyem-Assi</p>
      <p style="margin-top: 10px;">
        <a href="#" onclick="resetPassword()"> Mot de passe oublié ?</a>
      </p>
      <p style="margin-top: 5px;">
        <a href="#" onclick="contactAdmin()"> Contacter l'administrateur</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gajleiddneqwzbrzahgh.supabase.co';
    const SUPABASE_KEY = 'VOTRE_CLE_PUBLISHABLE_ICI'; // ⚠️ REMPLACEZ PAR VOTRE CLÉ
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginForm = document.getElementById('loginForm');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const loginBtn = document.getElementById('loginBtn');

    // Vérifier si déjà connecté
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        // Vérifier le rôle
        const { data: user } = await supabase
          .from('utilisateurs')
          .select('role, fonction')
          .eq('email', session.user.email)
          .single();
        
        if (user && ['admin', 'bureau'].includes(user.role)) {
          window.location.href = 'index.html';
        } else {
          await supabase.auth.signOut();
        }
      }
    }
    checkSession();

    // Gestion de la connexion
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
      
      try {
        // Essayer de se connecter avec Supabase Auth
        const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });
        
        if (authError) throw authError;
        
        // Vérifier le rôle de l'utilisateur dans la table utilisateurs
        const { data: user, error: userError } = await supabase
          .from('utilisateurs')
          .select('role, fonction, membre_id')
          .eq('email', email)
          .single();
        
        if (userError) throw userError;
        
        if (!user) {
          throw new Error('Utilisateur non trouvé dans la base de données.');
        }
        
        if (!['admin', 'bureau'].includes(user.role)) {
          await supabase.auth.signOut();
          throw new Error('Accès refusé. Seuls les administrateurs et membres du bureau peuvent se connecter.');
        }
        
        // Stocker les informations de session
        localStorage.setItem('user_role', user.role);
        localStorage.setItem('user_fonction', user.fonction);
        localStorage.setItem('user_email', email);
        localStorage.setItem('user_membre_id', user.membre_id || '');
        
        // Mettre à jour la dernière connexion
        await supabase
          .from('utilisateurs')
          .update({ derniere_connexion: new Date().toISOString() })
          .eq('email', email);
        
        successMessage.textContent = '✅ Connexion réussie ! Redirection...';
        successMessage.classList.add('show');
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
        
      } catch (error) {
        errorMessage.textContent = '❌ ' + (error.message || 'Erreur de connexion. Vérifiez vos identifiants.');
        errorMessage.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
      }
    });

    // Réinitialisation du mot de passe
    async function resetPassword() {
      const email = prompt('Entrez votre email enregistré pour réinitialiser le mot de passe :');
      if (email) {
        try {
          const { error } = await supabase.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/login.html'
          });
          if (error) throw error;
          alert('✅ Un email de réinitialisation a été envoyé à ' + email + '.\n\nVérifiez votre boîte mail (et les spams).');
        } catch (error) {
          alert('❌ Erreur : ' + error.message);
        }
      }
    }

    // Contacter l'administrateur
    function contactAdmin() {
      alert('📞 Pour contacter l\'administrateur :\n\n' +
            '📧 Email: admin@acaba2-0.cm\n' +
            ' Téléphone: +237 6XX XXX XXX\n\n' +
            'Ou contactez un membre du Bureau Exécutif.');
    }
  </script>
</body>
</html>
